# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,80; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu/nhóm -> 42 NV/nhóm (tổng 84 > 40 NV hiện có: không đủ người)
#   c) 20 nhân viên mỗi nhóm: trần n_hiệu_dụng < c/ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt cho mức chênh +5 điểm)
#   d) 6 depot mỗi nhóm: trần n_hiệu_dụng < c/ICC = 6 / 0,02 = 300 < 1.251 (không đạt)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu/NV (DE = 6,96; n_hiệu_dụng = 859,2)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần và cùng depot với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên bằng code với seed chốt trước, phân tầng theo các depot bố trí được cả hai nhóm.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo staff_id và log lượt mở trợ lý theo tài khoản.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, MDE, luật dừng và ngày quyết định chốt trước khi mở pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (vì 40 nhân viên không đủ mẫu cho mức chênh +5 điểm):
#   Chọn chia theo nhân viên (20 + 20) để giữ >= 20 cụm mỗi nhóm và tách được tác động; chấp nhận nâng MDE từ +5 lên +6 điểm (m >= 299 yêu cầu/NV).
#   Hệ quả bất lợi: nếu tác động thật của trợ lý chỉ là +5 điểm thì power thực tế giảm còn khoảng 0,64 (đã tính bằng statsmodels NormalIndPower với n = 859).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu: 51/1.200 = 4,25%; trong phạm vi pilot (noi_dia + hang_nang): 39/982 = 3,97%.
#   Ngưỡng an toàn gồm chênh từ 2 điểm phần trăm so với đối chứng và trần tuyệt đối 6%.

pilot:
  owner: Giám đốc vận hành LogiX-VN
  scope: Chỉ noi_dia (2.695,64 đ; 0,225x) và hang_nang (8.220,73 đ; 0,685x so với 12.000 đ) tại các depot bố trí được cả hai nhóm; loại quoc_te (22.515,17 đ; 1,876x) và doi_tac (10.214,87
    đ; 0,851x) [simulated]
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    stratification: depot
    seed: 1303448
  rollout:
  - 0.1
  - 0.25
  - 0.5
  schedule:
    preflight: '2026-11-27'
    four_staff_start: '2026-11-30'
    ten_staff_start: '2026-12-14'
    primary_cohort_start: '2026-12-28'
    primary_cohort_end: '2027-01-10'
    timezone: GMT+7
    note: Ngày dự kiến, chỉ chuyển bước sau khi đủ điều kiện an toàn. Đo chỉ số chính từ bước 20 nhân viên can thiệp; giữ theo dõi thêm ít nhất 8 ngày cho cửa sổ 24 giờ và 7 ngày.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.7
    mde: 0.06
    alpha: 0.05
    power: 0.8
    n_per_arm: 859
    raw_requests_per_arm_min: 5980
    requests_per_cluster_target: 299
    design_effect: 6.96
    clusters_per_arm: 20
    analysis: So sánh theo nhóm được phân ban đầu, kể cả khi nhân viên không mở trợ lý. Ước lượng chênh lệch và khoảng tin cậy 95% có hiệu chỉnh cụm theo nhân viên. Nếu số yêu cầu từng
      cụm mất cân bằng, kiểm tra lại cỡ mẫu hiệu dụng trước khi kết luận.
  sample_feasibility:
    owner: Giám đốc vận hành LogiX-VN
    required_workers_per_arm: 20
    observation_window_days: 14
    preflight_source: Đếm request_id đủ điều kiện theo staff_id và depot trong 14 ngày lịch sử tương ứng với ca làm dự kiến. Lập bảng cho 40 nhân viên thuộc các depot tham gia, kể cả người có 0 yêu cầu.
    effective_sample_formula: "Với m_i là số yêu cầu của nhân viên i, n_eff = tong(m_i) / (1 + ICC × (tong(m_i^2) / tong(m_i) - 1)), ICC = 0,02. Dùng công thức cho từng nhóm riêng."
    baseline_sample: "CSV giả lập có 982 yêu cầu trong phạm vi, thuộc 20 nhân viên quan sát được. Số yêu cầu mỗi nhân viên từ 39 đến 73, trung vị 47,5."
    planning_scenario: "Giả sử mỗi nhóm có mức mất cân bằng như mẫu, lưu lượng là 1.500 yêu cầu/ngày và tỷ trọng đủ điều kiện là 982/1.200. Với 100% lưu lượng dự kiến, mỗi nhóm có khoảng 8.593 yêu cầu thô và 880 hiệu dụng trong 14 ngày. Với 70% lưu lượng, mỗi nhóm có khoảng 6.015 thô và 844 hiệu dụng. Tất cả là dự phóng trên dữ liệu giả lập."
    qualification: "Chỉ mở kỳ đo chính khi dự báo theo danh sách thực tế cho thấy cả hai nhóm có đủ 20 nhân viên và đạt tối thiểu 859 yêu cầu hiệu dụng. Mốc 5.980 yêu cầu thô áp dụng khi các cụm cân bằng. Với mức lệch của mẫu, mốc dự kiến là 6.900 yêu cầu thô mỗi nhóm."
    insufficient_volume: "Nếu dự báo thiếu mẫu, giữ nguyên phân nhóm đối chứng và can thiệp, kéo dài kỳ đo theo tốc độ của nhóm thấp hơn. Kịch bản 70% cần ít nhất 17 ngày và thêm 8 ngày theo dõi sau ngày nhận ca cuối. Giám đốc vận hành phê duyệt lại lịch. Nếu chưa đủ mẫu hoặc theo dõi, ghi kết quả chưa đủ bằng chứng."
  identifiability:
    concurrent_control: Đối chứng tự xử lý trong cùng thời gian, với cùng tiêu chí nhận yêu cầu và cùng định nghĩa kết quả.
    spillover_risk: Nhân viên có thể chia sẻ gợi ý trong cùng depot. Giới hạn quyền theo tài khoản, ghi staff_id khi mở trợ lý, và ghi nhận chuyển yêu cầu giữa các nhóm.
    predeclared: Chốt trước ngày bắt đầu cách chia, chỉ số, ngưỡng, mốc thời gian và phương pháp phân tích.
    cluster_count: 20 nhân viên mỗi nhóm; giám sát số yêu cầu theo từng nhân viên.
  stop_rules:
  - NẾU tỷ lệ mở lại 7 ngày của đoàn hệ đủ theo dõi vượt 6% hoặc cao hơn đối chứng ít nhất 2 điểm phần trăm TRONG 3 kỳ theo dõi ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong
    30 phút và chuyển sang nhân viên tự làm KHÔNG THÌ chỉ chuyển bước khi đủ dữ liệu an toàn.
  - NẾU phát hiện ít nhất 1 ca hoàn tiền trùng hoặc thông báo “đã hoàn” thiếu bản ghi sổ cái thành công TRONG bất kỳ thời điểm nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và yêu
    cầu kế toán đối soát KHÔNG THÌ tiếp tục đối soát mỗi ngày.
  - NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia, giới hạn 2 lần chạy và báo Giám đốc vận hành KHÔNG THÌ giữ phạm vi đã duyệt.
  - NẾU tỷ lệ sửa hoặc bỏ gợi ý vượt 40% TRONG 1 tuần có ít nhất 30 quyết định xem lại THÌ Trưởng nhóm CSKH giữ nguyên mức rollout và phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ tiếp
    tục theo dõi và chỉ chuyển bước nếu đủ điều kiện an toàn.
  interim_looks: Dùng dữ liệu giữa kỳ để giám sát an toàn, chi phí và mức sử dụng. Chốt chỉ số chính sau khi đủ mẫu và đủ thời gian theo dõi.
  rollback: Giám đốc vận hành tắt cờ tính năng trong 30 phút. CSKH tiếp quản hàng đợi và kế toán đối soát các giao dịch đang xử lý.
  decision_date: '2027-01-19'
  decision_rule: Giám đốc vận hành chỉ kết luận hiệu quả khi đủ mẫu, đủ theo dõi, khoảng tin cậy 95% của mức tăng nằm trên 0 và các điều kiện an toàn, chi phí đều đạt. Nếu thiếu mẫu
    hoặc chưa đủ theo dõi, kéo dài theo kế hoạch cập nhật đã duyệt.
  simulated_inputs:
  - Chi phí mỗi việc thành công noi_dia = 2.695,64 đ (0,225x) và hang_nang = 8.220,73 đ (0,685x) [simulated]
  - Chi phí mỗi việc thành công quoc_te = 22.515,17 đ (1,876x) và doi_tac = 10.214,87 đ (0,851x) [simulated]
  - Chi phí biến đổi phạm vi pilot = 3.413,90 đ; cộng cố định 40 triệu/tháng ở 22.500 yêu cầu/tháng = 5.784,27 đ [simulated]
  - Chi phí xem lại 100% phạm vi pilot = 11.742,79 đ (9 phút làm lại) đến 12.414,50 đ (15,30 phút làm lại) [simulated]
  - Tỷ lệ mở lại 4,25% toàn mẫu và 3,97% trong phạm vi là quan sát từ dữ liệu giả lập.
