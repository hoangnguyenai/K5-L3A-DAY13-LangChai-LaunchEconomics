# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,80; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu/nhóm -> 42 NV/nhóm (tổng 84 > 40 NV hiện có: không đủ người)
#   c) 20 nhân viên mỗi nhóm: trần n_hiệu_dụng < c/ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt cho mức chênh +5 điểm)
#   d) 6 depot mỗi nhóm: trần n_hiệu_dụng < c/ICC = 6 / 0,02 = 300 < 1.251 (không đạt)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu/NV (DE = 6,96; n_hiệu_dụng = 859,2)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần và cùng depot với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên bằng code với seed chốt trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo staff_id và log lượt mở trợ lý theo tài khoản.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính, MDE, luật dừng và ngày quyết định chốt trước khi mở pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (vì 40 nhân viên không đủ mẫu cho mức chênh +5 điểm):
#   Chọn chia theo nhân viên (20 + 20) để giữ >= 20 cụm mỗi nhóm và tách được tác động; chấp nhận nâng MDE từ +5 lên +6 điểm (m >= 299 yêu cầu/NV).
#   Hệ quả bất lợi: nếu tác động thật của trợ lý chỉ là +5 điểm thì power thực tế giảm còn khoảng 0,64 (đã tính bằng statsmodels NormalIndPower với n = 859).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu: 51/1.200 = 4,25%; trong phạm vi pilot (noi_dia + hang_nang): 39/982 = 3,97%.
#   Không đặt ngưỡng tuyệt đối 3% vì sẽ dừng ngay tuần đầu; chọn ngưỡng tương đối >= +2 điểm so với đối chứng kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.695,64 đ; 0,225x) và hang_nang (8.220,73 đ; 0,685x so với 12.000 đ) trên 12 depot; loại quoc_te (22.515,17 đ; 1,876x) và doi_tac (10.214,87 đ; 0,851x) [simulated]"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên, mỗi bước một tuần; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng xử lý song song trong cùng tuần và cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình do nhân viên cùng depot có thể trao đổi; giảm bằng phân quyền truy cập theo staff_id, phân tầng ngẫu nhiên theo depot và theo dõi log sử dụng theo tài khoản"
    predeclared: "Có: chỉ số chính, MDE +6 điểm, luật dừng, seed phân ngẫu nhiên và ngày quyết định đều chốt trước ngày chạy pilot"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng hay báo đã hoàn nhưng sổ cái chưa ghi nhận TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (gồm xem lại và làm lại) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng nhóm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (quyet_dinh_xem_lai là sua hoặc bo) > 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên trong 3 ngày để xử lý nguyên nhân KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành LogiX-VN bấm cờ tắt trợ lý trên cổng CSKH, hiệu lực trong 30 phút; khách được phục vụ ngay bằng luồng nhân viên tự làm (6 phút/yêu cầu)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công noi_dia = 2.695,64 đ (0,225x) và hang_nang = 8.220,73 đ (0,685x) [simulated]"
    - "Chi phí mỗi việc thành công quoc_te = 22.515,17 đ (1,876x) và doi_tac = 10.214,87 đ (0,851x) [simulated]"
    - "Chi phí biến đổi phạm vi pilot = 3.413,90 đ; cộng cố định 40 triệu/tháng ở 22.500 yêu cầu/tháng = 5.784,27 đ [simulated]"
    - "Chi phí xem lại 100% phạm vi pilot = 11.742,79 đ (9 phút làm lại) đến 12.414,50 đ (15,30 phút làm lại) [simulated]"
